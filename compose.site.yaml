# The website (https://grc-flow.com, www redirects to it) on the same server as the app
# (https://app.grc-flow.com). Add it after compose.caddy.yaml:
#
#   docker compose -f compose.yaml -f compose.postgres.yaml -f compose.caddy.yaml \
#     -f compose.site.yaml up -d --build
#
# Set GRC_SITE_DOMAIN in .env (e.g. grc-flow.com) and point the @ and www DNS records at
# this server. deploy/setup-server.sh does all of this; see docs/DEPLOY_ORACLE.md.
services:
  # The GRC-Flow website (Next.js), built from its own repository.
  website:
    build:
      context: ${GRC_WEBSITE_CONTEXT:-https://github.com/Harshitahusts/GRC-WEBSITE.git#main}
      args:
        # The website's "Sign in" links go to the app.
        NEXT_PUBLIC_APP_URL: https://${GRC_DOMAIN}
    restart: unless-stopped

  web:
    environment:
      # The app's sign-in page links back to the website.
      GRC_SITE_URL: https://${GRC_SITE_DOMAIN}

  caddy:
    environment:
      GRC_SITE_ADDRESS: ${GRC_SITE_DOMAIN:?Set GRC_SITE_DOMAIN in .env, e.g. grc-flow.com}, www.${GRC_SITE_DOMAIN}
    depends_on:
      - website
