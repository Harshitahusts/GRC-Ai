# Put GRC Flow on its own subdomain over HTTPS (for example https://app.grc-flow.com),
# and optionally the website (https://grc-flow.com) on the same server:
#
#   docker compose -f compose.yaml -f compose.postgres.yaml -f compose.caddy.yaml up -d --build
#
# Before running: point the subdomain's DNS (an A record) at this server, open ports 80
# and 443, and set GRC_DOMAIN and POSTGRES_PASSWORD in .env. Caddy gets the certificate on
# first start. deploy/setup-server.sh does all of this; see docs/DEPLOY_ORACLE.md.
services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      GRC_DOMAIN: ${GRC_DOMAIN:?Set GRC_DOMAIN in .env, e.g. app.grc-flow.com}
      # Optional website on the same server, e.g. "grc-flow.com, www.grc-flow.com".
      # Unset: a local-only placeholder address, so no certificate is requested for it.
      GRC_SITE_ADDRESS: ${GRC_SITE_ADDRESS:-http://site.localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The website's files. Replace deploy/site with your own (or set GRC_SITE_DIR).
      - ${GRC_SITE_DIR:-./deploy/site}:/srv/site:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped
  web:
    # Only Caddy talks to the app; nothing is published on the host.
    ports: !reset []
    environment:
      GRC_PUBLIC_URL: https://${GRC_DOMAIN}
      GRC_FORCE_HTTPS: "1"
      # Caddy's address on the Compose network changes, so trust any forwarder here:
      # the app is reachable only through Caddy because no port is published.
      GRC_TRUSTED_PROXIES: "*"

volumes:
  caddy-data:
  caddy-config:
