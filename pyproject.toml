[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grc-agent"
version = "0.1.0"
description = "A Claude-powered agent for governance, risk, and compliance (GRC) work."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "anthropic>=1.8",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "python-docx>=1.1",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
grc-agent = "grc_agent.cli:main"
grc-kpis = "grc_agent.kpis.cli:main"
grc-web = "grc_agent.web.cli:main"
grc-corpus = "grc_agent.corpus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/grc_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
