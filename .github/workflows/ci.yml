name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.14"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    # A clean install of exactly what start.sh / start.bat install, so a
    # dependency missing from pyproject.toml fails here, not on a user's machine.
    - name: Install the app
      run: |
        python -m pip install --upgrade pip
        pip install -e .
    - name: The app starts
      run: python -c "from grc_agent.web.app import create_app; create_app('ci-data')"
    - name: Install test tools
      run: pip install -e ".[dev]"
    - name: Lint
      run: |
        ruff check .
        ruff format --check .
    # Known vulnerabilities (PyPI advisories, with CVE ids) in every installed library.
    # The dependency set is the same on every platform, so one run is enough.
    - name: Dependency vulnerabilities
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      run: |
        pip install --upgrade pip setuptools pip-audit
        pip-audit --skip-editable
    - name: Tests
      run: pytest -q
    # Run start.bat itself on Windows, as a user would: it creates its own .venv,
    # installs, checks for a running copy and an account, then serve --help exits.
    - name: start.bat works
      if: runner.os == 'Windows'
      timeout-minutes: 10
      shell: cmd
      run: |
        echo ci-test-password| grc-web --data-dir var adduser ci --password-stdin
        call start.bat --help

  # The same suite on PostgreSQL (GRC_DATABASE_URL), each test in its own schema.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: grc
          POSTGRES_PASSWORD: grc
          POSTGRES_DB: grc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GRC_DATABASE_URL: postgresql://grc:grc@localhost:5432/grc
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,postgres]"
    - name: Tests on PostgreSQL
      run: pytest -q

