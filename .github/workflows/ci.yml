name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.14"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    # A clean install of exactly what start.sh / start.bat install, so a
    # dependency missing from pyproject.toml fails here, not on a user's machine.
    - name: Install the app
      run: |
        python -m pip install --upgrade pip
        pip install -e .
    - name: The app starts
      run: python -c "from grc_agent.web.app import create_app; create_app('ci-data')"
    - name: Install test tools
      run: pip install -e ".[dev]"
    - name: Lint
      run: |
        ruff check .
        ruff format --check .
    - name: Tests
      run: pytest -q
