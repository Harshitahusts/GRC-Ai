<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GRC agent{% endblock %} · GRC agent</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% if user %}
<header class="topbar">
  <a class="brand" href="/">GRC agent <span class="tag">DPDPA prototype</span></a>
  <nav>
    {% set path = request.url.path %}
    <a href="/" {% if path == "/" %}aria-current="page"{% endif %}>Dashboard</a>
    <a href="/engagements" {% if path.startswith("/engagements") %}aria-current="page"{% endif %}>Engagements</a>
    <a href="/corpus" {% if path.startswith("/corpus") %}aria-current="page"{% endif %}>Corpus</a>
    <a href="/content" {% if path.startswith("/content") %}aria-current="page"{% endif %}>Docs &amp; blog</a>
    <a href="/kpis" {% if path == "/kpis" %}aria-current="page"{% endif %}>KPIs</a>
    <a href="/assistant" {% if path == "/assistant" %}aria-current="page"{% endif %}>Assistant</a>
  </nav>
  <form method="post" action="/logout" class="logout">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <span class="muted">{{ user }}</span>
    <button class="link">Log out</button>
  </form>
</header>
{% endif %}
<main class="{% block main_class %}page{% endblock %}">
  {% for kind, message in flashes %}
  <div class="flash flash-{{ kind }}" role="status">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
